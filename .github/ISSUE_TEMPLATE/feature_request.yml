name: 아이디어 제안
description: 있으면 좋겠는 기능이나 바뀌었으면 하는 점
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 점이 불편한가요
      description: 지금 어떻게 하고 있고, 어디서 시간이 드는지
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 이렇게 되면 좋겠어요
  - type: textarea
    id: example
    attributes:
      label: 예시
      description: 참고할 쇼츠 링크, 화면 캡처, 다른 도구 등
