name: 문제 알리기
description: 앱이 멈추거나, 오류 카드가 뜨거나, 결과가 이상할 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        알려 주셔서 고마워요. **설정 → 피드백 zip 만들기** 로 만든 파일을 붙여 주시면 원인을 훨씬 빨리 찾을 수 있어요. 영상은 들어가지 않아요.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 어떤 화면에서 무엇을 눌렀고, 무엇을 기대했는데 어떻게 됐는지
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 오류 카드 내용
      description: 빨간 카드의 코드(E_로 시작)와 문장을 그대로 붙여 주세요
      render: text
  - type: input
    id: version
    attributes:
      label: 버전
      description: 설정 탭의 앱 · 분석 엔진 버전 (예 0.2.0)
    validations:
      required: true
  - type: dropdown
    id: gpu
    attributes:
      label: 그래픽카드
      options: [NVIDIA, 그 외 / 없음, 모름]
  - type: textarea
    id: extra
    attributes:
      label: 덧붙일 것
      description: 피드백 zip, 스크린샷, 영상 길이·해상도 등
