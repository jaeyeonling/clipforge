version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: monthly }
    groups:
      app: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: monthly }
    groups:
      desktop: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
